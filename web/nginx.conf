server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compress text, including JSON the API sends through this proxy. HTML is always included.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;

  # The API sets its own Cache-Control per route (server/src/cache-policy.ts).
  location /v1/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Photo upload: 11 MB body, JSON 413. A regex location does not inherit the proxy lines of /v1/.
  location ~ ^/v1/admin/products/[^/]+/images$ {
    client_max_body_size 11m;
    limit_except POST { deny all; }
    error_page 413 = @too_large;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Article cover and body-image uploads: the same limit and JSON 413 as the product photos.
  location ~ ^/v1/admin/articles/[^/]+/(cover|images)$ {
    client_max_body_size 11m;
    limit_except POST { deny all; }
    error_page 413 = @too_large;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location @too_large {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 413 '{"error":{"code":"TOO_LARGE","message":"Ukuran file maksimal 10 MB.","details":[]}}';
  }

  # Product photos: allowlist only. The regex is quoted because it contains braces.
  location ~ "^/media/((products|articles)/[A-Za-z0-9_-]+/[0-9a-f]{16}-[0-9]{3,4}\.webp)$" {
    limit_except GET { deny all; }
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    rewrite ^/media/(.*)$ /${MINIO_BUCKET}/media/$1? break;
    proxy_pass ${MEDIA_UPSTREAM};
    proxy_next_upstream off;
    proxy_intercept_errors on;
    error_page 400 401 403 404 405 500 502 503 504 = @media_404;
    proxy_hide_header Server;
    proxy_hide_header Cache-Control;
    proxy_hide_header Set-Cookie;
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-id-2;
    proxy_hide_header x-amz-version-id;
    proxy_hide_header x-amz-server-side-encryption;
    proxy_hide_header x-minio-deployment-id;
    proxy_hide_header x-minio-error-code;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Xss-Protection;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Vary;
    proxy_hide_header X-Ratelimit-Limit;
    proxy_hide_header X-Ratelimit-Remaining;
    proxy_hide_header X-Content-Type-Options;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
  }

  # Everything else under /media/ (including /media/ itself) never reaches MinIO.
  location /media/ {
    error_page 404 = @media_404;
    return 404;
  }

  location @media_404 {
    internal;
    # Empty types map: otherwise nginx labels a 404 for a .webp path as image/webp.
    types { }
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 404 "Not found";
  }

  # Blog, product and category pages: the API fills index.html with real tags, JSON-LD and text for search
  # engines and link previews. Any API error serves the plain index.html, so the shop never breaks.
  # X-Render-Uri is the raw request line (still percent-encoded, with its query); the API decodes it once.
  location ~ ^/(blog|en/blog)(/|$) {
    rewrite ^ /render break;
    proxy_set_header X-Render-Uri $request_uri;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @spa;
  }

  location ~ ^/(produk|kategori)/ {
    rewrite ^ /render break;
    proxy_set_header X-Render-Uri $request_uri;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @spa;
  }

  location @spa {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  location = /sitemap.xml {
    proxy_pass http://api:8080/sitemap.xml;
  }

  location = /robots.txt {
    proxy_pass http://api:8080/robots.txt;
  }

  # The built index.html for the API's renderer; private networks only (the compose network and localhost).
  location = /__shell.html {
    allow 127.0.0.1;
    allow 172.16.0.0/12;
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    deny all;
    try_files /index.html =404;
  }

  location = /health {
    proxy_pass http://api:8080/health;
  }

  # Vite puts a content hash in every file name here, so a changed file always gets a new name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html and every page URL: check on each load (304 when unchanged) so a deploy is picked up at once.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
