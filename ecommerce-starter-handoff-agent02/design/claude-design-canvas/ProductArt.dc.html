<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Product Art Placeholder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="{{root}}" role="img" aria-label="{{label}}">
<div style="position: relative; width: 52%; aspect-ratio: 1 / 1">
<sc-if value="{{isBottle}}" hint-placeholder-val="{{ true }}">
<div style="{{c.a}} left: 31%; top: 4%; width: 34%; height: 8%; border-radius: 6px"></div>
<div style="{{c.a}} left: 43%; top: 11%; width: 14%; height: 14%"></div>
<div style="{{c.f}} left: 24%; top: 24%; width: 52%; height: 76%; border-radius: 22% 22% 14% 14%"></div>
<div style="{{c.l}} left: 33%; top: 52%; width: 34%; height: 24%; border-radius: 4px"></div>
</sc-if>
<sc-if value="{{isJar}}" hint-placeholder-val="{{ false }}">
<div style="{{c.a}} left: 10%; top: 32%; width: 80%; height: 16%; border-radius: 10px"></div>
<div style="{{c.f}} left: 14%; top: 46%; width: 72%; height: 46%; border-radius: 14% 14% 20% 20%"></div>
<div style="{{c.l}} left: 30%; top: 60%; width: 40%; height: 18%; border-radius: 4px"></div>
</sc-if>
<sc-if value="{{isTube}}" hint-placeholder-val="{{ false }}">
<div style="{{c.f}} left: 30%; top: 2%; width: 40%; height: 76%; border-radius: 6px 6px 30% 30%"></div>
<div style="{{c.l}} left: 37%; top: 30%; width: 26%; height: 26%; border-radius: 4px"></div>
<div style="{{c.a}} left: 36%; top: 76%; width: 28%; height: 20%; border-radius: 6px"></div>
</sc-if>
<sc-if value="{{isDropper}}" hint-placeholder-val="{{ false }}">
<div style="{{c.a}} left: 40%; top: 2%; width: 20%; height: 20%; border-radius: 50%"></div>
<div style="{{c.a}} left: 34%; top: 20%; width: 32%; height: 16%; border-radius: 6px"></div>
<div style="{{c.f}} left: 26%; top: 36%; width: 48%; height: 62%; border-radius: 18%"></div>
<div style="{{c.l}} left: 34%; top: 56%; width: 32%; height: 22%; border-radius: 4px"></div>
</sc-if>
<sc-if value="{{isCable}}" hint-placeholder-val="{{ false }}">
<div style="{{c.ring}} left: 10%; top: 10%; width: 64%; height: 64%"></div>
<div style="{{c.ring}} left: 20%; top: 20%; width: 44%; height: 44%"></div>
<div style="{{c.f}} left: 58%; top: 66%; width: 30%; height: 13%; border-radius: 5px"></div>
<div style="{{c.a}} left: 86%; top: 69%; width: 12%; height: 7%; border-radius: 3px"></div>
<div style="{{c.f}} left: 4%; top: 80%; width: 26%; height: 12%; border-radius: 5px"></div>
</sc-if>
<sc-if value="{{isCharger}}" hint-placeholder-val="{{ false }}">
<div style="{{c.f}} left: 16%; top: 12%; width: 68%; height: 76%; border-radius: 20%"></div>
<div style="{{c.a}} left: 30%; top: 30%; width: 14%; height: 6%; border-radius: 3px"></div>
<div style="{{c.a}} left: 56%; top: 30%; width: 14%; height: 6%; border-radius: 3px"></div>
<div style="{{c.l}} left: 38%; top: 48%; width: 24%; height: 9%; border-radius: 2px"></div>
<div style="{{c.l}} left: 30%; top: 72%; width: 40%; height: 3%; border-radius: 2px"></div>
</sc-if>
<sc-if value="{{isAdapter}}" hint-placeholder-val="{{ false }}">
<div style="{{c.f}} left: 36%; top: 6%; width: 28%; height: 46%; border-radius: 10px"></div>
<div style="{{c.a}} left: 42%; top: 0%; width: 16%; height: 8%; border-radius: 2px"></div>
<div style="{{c.f}} left: 47%; top: 50%; width: 6%; height: 26%"></div>
<div style="{{c.f}} left: 34%; top: 74%; width: 32%; height: 22%; border-radius: 6px"></div>
<div style="{{c.l}} left: 40%; top: 80%; width: 20%; height: 8%; border-radius: 2px"></div>
</sc-if>
<sc-if value="{{isHub}}" hint-placeholder-val="{{ false }}">
<div style="{{c.f}} left: 6%; top: 32%; width: 88%; height: 34%; border-radius: 12px"></div>
<div style="{{c.l}} left: 16%; top: 44%; width: 10%; height: 9%; border-radius: 2px"></div>
<div style="{{c.l}} left: 31%; top: 44%; width: 10%; height: 9%; border-radius: 2px"></div>
<div style="{{c.l}} left: 46%; top: 44%; width: 10%; height: 9%; border-radius: 2px"></div>
<div style="{{c.a}} left: 64%; top: 44%; width: 18%; height: 9%; border-radius: 2px"></div>
<div style="{{c.f}} left: 46%; top: 64%; width: 8%; height: 24%"></div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["bottle","jar","tube","dropper","cable","charger","adapter","hub"],"default":"cable"},"bg":{"editor":"color","default":"#F2F4F7"},"fg":{"editor":"color","default":"#1A2233"},"accent":{"editor":"color","default":"#1F5AE0"},"label":{"editor":"text","default":"Ilustrasi produk"},"radius":{"editor":"text","default":"0px"},"$preview":{"width":320,"height":320}}'>
class Component extends DCLogic {
renderVals() {
var k = this.props.kind || "cable";
var bg = this.props.bg || "#F2F4F7";
var fg = this.props.fg || "#1A2233";
var ac = this.props.accent || "#1F5AE0";
var base = "position:absolute;box-sizing:border-box;";
return {
root: "width:100%;height:100%;min-height:120px;background:" + bg + ";display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:" + (this.props.radius || "0px"),
label: this.props.label || "Ilustrasi produk",
isBottle: k === "bottle", isJar: k === "jar", isTube: k === "tube", isDropper: k === "dropper",
isCable: k === "cable", isCharger: k === "charger", isAdapter: k === "adapter", isHub: k === "hub",
c: {
f: base + "background:" + fg + ";",
a: base + "background:" + ac + ";",
l: base + "background:" + bg + ";opacity:0.85;",
ring: base + "border-radius:50%;border:10px solid " + fg + ";"
}
};
}
}
</script>
</body>
</html>
