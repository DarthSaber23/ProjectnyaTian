services:
  # Sambung API (default service on :8080)
  api:
    build: ./server
    env_file:
      - ./server/.env
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Image work shares this process with checkout; starting value, confirmed against a measured peak.
    mem_limit: 1536m
    restart: unless-stopped

  # Halimun API (skincare service on :8081)
  api-halimun:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      - SITE_BRAND=halimun
      - PORT=8080
      - MINIO_BUCKET=${MINIO_BUCKET_HALIMUN:-tian-halimun-media}
    ports:
      - "8081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1536m
    restart: unless-stopped
    networks:
      halimun:
        aliases:
          - api

  # Sambung Storefront (default storefront on :80)
  web:
    build: ./web
    ports:
      - "80:80"
    depends_on:
      - api
    # nginx reaches MinIO on the host for /media/; only these two variables are substituted in the template.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - "MINIO_BUCKET=${MINIO_BUCKET:-tian-media}"
      - "MEDIA_UPSTREAM=${MEDIA_UPSTREAM:-http://host.docker.internal:9000}"
      - "NGINX_ENVSUBST_FILTER=^(MINIO_BUCKET|MEDIA_UPSTREAM)$"
    restart: unless-stopped

  # Halimun Storefront (skincare storefront on :81)
  web-halimun:
    build:
      context: ./web
      args:
        VITE_BRAND: halimun
    ports:
      - "81:80"
    depends_on:
      - api-halimun
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - "MINIO_BUCKET=${MINIO_BUCKET_HALIMUN:-tian-halimun-media}"
      - "MEDIA_UPSTREAM=${MEDIA_UPSTREAM:-http://host.docker.internal:9000}"
      - "NGINX_ENVSUBST_FILTER=^(MINIO_BUCKET|MEDIA_UPSTREAM)$"
    restart: unless-stopped
    networks:
      - halimun
      - default

networks:
  halimun:
