services:
  api:
    build: ./server
    env_file:
      - ./server/.env
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Image work shares this process with checkout; starting value, confirmed against a measured peak.
    mem_limit: 1536m
    restart: unless-stopped
  web:
    build: ./web
    ports:
      - "80:80"
    depends_on:
      - api
    # nginx reaches MinIO on the host for /media/; only these two variables are substituted in the template.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - "MINIO_BUCKET=${MINIO_BUCKET:-tian-media}"
      - "MEDIA_UPSTREAM=${MEDIA_UPSTREAM:-http://host.docker.internal:9000}"
      - "NGINX_ENVSUBST_FILTER=^(MINIO_BUCKET|MEDIA_UPSTREAM)$"
    restart: unless-stopped
